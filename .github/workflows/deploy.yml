name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_WEB3FORMS_DEMO_ACCESS_KEY: ${{ secrets.VITE_WEB3FORMS_DEMO_ACCESS_KEY }}
          VITE_WEB3FORMS_SUPPORT_ACCESS_KEY: ${{ secrets.VITE_WEB3FORMS_SUPPORT_ACCESS_KEY }}
          VITE_WEB3FORMS_SALES_ACCESS_KEY: ${{ secrets.VITE_WEB3FORMS_SALES_ACCESS_KEY }}
          VITE_WEB3FORMS_PARTNER_ACCESS_KEY: ${{ secrets.VITE_WEB3FORMS_PARTNER_ACCESS_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
